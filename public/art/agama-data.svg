<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
  <title id="t">Agama, the course's lizard, holding a stopwatch and pointing at a route map with the shortest route from start to finish marked in orange</title>
  <defs>
    <style>
      .ol { stroke: #2a1d14; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      .line { fill: none; stroke: #2a1d14; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <ellipse cx="200" cy="288" rx="175" ry="8" fill="#000" opacity="0.1"/>

  <!-- a route map on a board: places, roads, the shortest route in orange -->
  <g>
    <rect x="212" y="40" width="186" height="200" rx="12" fill="#fffaf0" class="ol" stroke-width="5"/>
    <g stroke="#9aa3ad" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M240 210 L322 202"/>
      <path d="M322 202 L360 150"/>
      <path d="M360 150 L370 72"/>
      <path d="M240 210 L250 120"/>
      <path d="M250 120 L300 70"/>
      <path d="M300 70 L370 72"/>
    </g>
    <g stroke="#f7a41d" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M240 210 L250 120 L300 70 L370 72"/>
    </g>
    <g class="ol" stroke-width="3.5">
      <circle cx="240" cy="210" r="9" fill="#3fb37f"/>
      <circle cx="322" cy="202" r="7" fill="#fffaf0"/>
      <circle cx="360" cy="150" r="7" fill="#fffaf0"/>
      <circle cx="250" cy="120" r="7" fill="#fffaf0"/>
      <circle cx="300" cy="70" r="7" fill="#fffaf0"/>
      <circle cx="370" cy="72" r="9" fill="#ff6a2b"/>
    </g>
    <path class="ol" fill="#2a1d14" stroke-width="2" d="M372 46 L372 66 M372 46 L388 52 L372 58"/>
  </g>

  <!-- tail: curling round behind, spotted, with the orange band -->
  <path class="ol" fill="#2f6fe0" d="M78 232 C56 244 30 248 20 228 C12 210 26 194 42 198 C54 201 56 216 46 218 C40 219 38 212 42 210 L38 204 C28 208 28 222 38 228 C52 236 66 230 80 246 Z"/>
  <path fill="#ff6a2b" d="M22 220 C18 208 26 198 38 197 L41 204 C32 206 28 214 30 222 Z"/>
  <g fill="#1d3f8f" opacity="0.5"><circle cx="54" cy="240" r="3"/><circle cx="66" cy="238" r="2.5"/><circle cx="32" cy="232" r="2.5"/></g>

  <!-- legs: bent, splayed, toes with round pads -->
  <path class="ol" fill="#2f6fe0" d="M88 234 C70 238 56 250 54 264 C53 272 56 278 62 280 L78 280 C76 272 76 264 80 256 C84 250 90 246 96 244 Z"/>
  <path class="ol" fill="#2f6fe0" d="M132 234 C150 238 164 250 166 264 C167 272 164 278 158 280 L142 280 C144 272 144 264 140 256 C136 250 130 246 124 244 Z"/>
  <path fill="#2457b8" d="M60 262 C62 252 70 244 80 240 C74 248 70 256 70 266 Z" opacity="0.8"/>
  <g class="ol" fill="#2f6fe0" stroke-width="3.5">
    <ellipse cx="42" cy="284" rx="7" ry="5"/><ellipse cx="53" cy="289" rx="7" ry="5"/><ellipse cx="66" cy="290" rx="7" ry="5"/><ellipse cx="78" cy="286" rx="6.5" ry="5"/>
    <ellipse cx="178" cy="284" rx="7" ry="5"/><ellipse cx="167" cy="289" rx="7" ry="5"/><ellipse cx="154" cy="290" rx="7" ry="5"/><ellipse cx="142" cy="286" rx="6.5" ry="5"/>
  </g>
  <ellipse cx="62" cy="281" rx="18" ry="7" fill="#2f6fe0"/>
  <ellipse cx="158" cy="281" rx="18" ry="7" fill="#2f6fe0"/>

  <!-- pointing arm (right), at the terminal -->
  <path class="ol" fill="#2f6fe0" d="M138 168 C154 166 172 162 190 158 L194 172 C176 176 158 180 142 184 Z"/>
  <g class="ol" fill="#2f6fe0" stroke-width="3.5">
    <ellipse cx="216" cy="160" rx="11" ry="4.5"/>
    <ellipse cx="206" cy="172" rx="7" ry="4"/>
    <circle cx="198" cy="165" r="10"/>
  </g>

  <!-- body: chubby pear, cream belly in bands, spots -->
  <path class="ol" fill="#2f6fe0" d="M70 168 C60 200 64 240 84 258 C98 270 122 270 136 258 C156 240 160 200 150 168 C140 148 80 148 70 168 Z"/>
  <path class="ol" fill="#f3ead2" stroke-width="3" d="M90 170 C82 198 86 236 98 250 C106 257 114 257 122 250 C134 236 138 198 130 170 C120 160 100 160 90 170 Z"/>
  <path class="line" stroke-width="2.5" opacity="0.5" d="M90 192 C102 197 118 197 130 192 M89 212 C102 217 118 217 131 212 M92 232 C104 236 116 236 128 232"/>
  <g fill="#1d3f8f" opacity="0.55"><circle cx="76" cy="200" r="3.5"/><circle cx="72" cy="222" r="3"/><circle cx="80" cy="244" r="3"/><circle cx="146" cy="200" r="3.5"/><circle cx="148" cy="224" r="3"/></g>

  <!-- head: big and round, the agama's orange-red -->
  <path class="ol" fill="#ff6a2b" d="M36 96 C34 54 70 28 110 28 C150 28 186 54 184 96 C184 122 162 142 110 144 C58 142 36 122 36 96 Z"/>
  <!-- cheek shading and spots -->
  <path fill="#e0521a" d="M42 110 C48 128 70 140 110 142 C80 136 58 126 48 104 Z" opacity="0.7"/>
  <g fill="#c94512" opacity="0.6"><circle cx="96" cy="58" r="3"/><circle cx="110" cy="52" r="3.5"/><circle cx="124" cy="58" r="3"/><circle cx="104" cy="68" r="2.5"/><circle cx="118" cy="68" r="2.5"/></g>
  <!-- wide open grin, tongue, cream chin -->
  <path class="ol" fill="#f3ead2" stroke-width="3.5" d="M50 112 C66 132 154 132 170 112 C168 128 148 146 110 148 C72 146 52 128 50 112 Z"/>
  <path class="ol" fill="#5a1e1a" stroke-width="3.5" d="M62 106 C82 118 138 118 158 106 C152 128 132 140 110 140 C88 140 68 128 62 106 Z"/>
  <path fill="#e86a7a" d="M86 130 C94 120 126 120 134 130 C128 140 92 140 86 130 Z"/>
  <!-- nostrils -->
  <ellipse cx="102" cy="94" rx="3" ry="2.2" fill="#2a1d14"/>
  <ellipse cx="118" cy="94" rx="3" ry="2.2" fill="#2a1d14"/>
  <!-- big shiny eyes in raised sockets -->
  <circle class="ol" cx="74" cy="74" r="26" fill="#ff7d45"/>
  <circle class="ol" cx="146" cy="74" r="26" fill="#ff7d45"/>
  <circle cx="76" cy="77" r="20" fill="#fff" stroke="#2a1d14" stroke-width="3"/>
  <circle cx="144" cy="77" r="20" fill="#fff" stroke="#2a1d14" stroke-width="3"/>
  <circle cx="79" cy="79" r="14" fill="#c8762a"/>
  <circle cx="141" cy="79" r="14" fill="#c8762a"/>
  <circle cx="80" cy="80" r="9" fill="#2a1d14"/>
  <circle cx="140" cy="80" r="9" fill="#2a1d14"/>
  <circle cx="85" cy="73" r="5" fill="#fff"/>
  <circle cx="145" cy="73" r="5" fill="#fff"/>
  <circle cx="75" cy="86" r="2.2" fill="#fff"/>
  <circle cx="135" cy="86" r="2.2" fill="#fff"/>

  <!-- waving arm (left), open hand with splayed fingers: in front, out beside the head -->
  <g transform="translate(-12 6)">
  <path class="ol" fill="#2f6fe0" d="M80 174 C64 172 50 164 42 150 C38 142 36 134 36 126 L50 124 C50 132 52 140 56 146 C62 154 72 158 84 160 Z"/>
  <!-- a stopwatch in the raised hand -->
  <g>
    <rect class="ol" x="36" y="74" width="10" height="9" rx="2" fill="#9aa3ad" stroke-width="3"/>
    <circle class="ol" cx="41" cy="104" r="22" fill="#f3ead2"/>
    <circle cx="41" cy="104" r="16" fill="#fff" stroke="#2a1d14" stroke-width="2.5"/>
    <path class="line" stroke-width="2.5" d="M41 92 v3 M53 104 h-3 M41 116 v-3 M29 104 h3"/>
    <path class="line" stroke-width="3.5" stroke="#ff6a2b" d="M41 104 L49 96"/>
    <circle cx="41" cy="104" r="2.5" fill="#2a1d14"/>
    <ellipse class="ol" cx="41" cy="128" rx="13" ry="8" fill="#2f6fe0" stroke-width="3.5"/>
  </g>
  

  </g>
  <!-- helmet, perched on top, Zig orange -->
  <path class="ol" fill="#f7a41d" d="M60 48 C58 8 162 8 160 48 C130 38 90 38 60 48 Z"/>
  <path class="line" stroke-width="3.5" d="M86 22 l5 14 M110 16 l0 16 M134 22 l-5 14"/>
  <path class="line" stroke-width="3" d="M62 46 C80 40 140 40 158 46"/>
</svg>
