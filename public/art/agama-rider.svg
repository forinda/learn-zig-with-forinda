<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">Agama, a red-headed lizard in a cycling helmet, racing a road bike</title>
  <defs>
    <style>
      .ol { stroke: #1d1a16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- ground shadow and speed lines -->
  <ellipse cx="240" cy="334" rx="190" ry="10" fill="#000" opacity="0.12"/>
  <g stroke="#f7a41d" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <path d="M18 150h46M8 190h40M24 230h34"/>
  </g>

  <!-- far leg (behind the bike) -->
  <path class="ol" d="M212 168 L250 226 L206 252" fill="none" stroke-width="24"/>
  <path d="M212 168 L250 226 L206 252" fill="none" stroke="#2457b8" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tail: long, blue, with the agama's orange band -->
  <path class="ol" d="M200 168 C150 160 120 150 96 128 C78 112 58 104 36 112" fill="none" stroke-width="22"/>
  <path d="M200 168 C150 160 120 150 96 128 C78 112 58 104 36 112" fill="none" stroke="#2f6fe0" stroke-width="13" stroke-linecap="round"/>
  <path d="M96 128 C80 114 66 108 52 108" fill="none" stroke="#ff6a2b" stroke-width="13" stroke-linecap="round"/>

  <!-- wheels -->
  <g>
    <circle cx="130" cy="272" r="62" fill="none" stroke="#1d1a16" stroke-width="14"/>
    <circle cx="130" cy="272" r="52" fill="none" stroke="#9aa3ad" stroke-width="4"/>
    <circle cx="350" cy="272" r="62" fill="none" stroke="#1d1a16" stroke-width="14"/>
    <circle cx="350" cy="272" r="52" fill="none" stroke="#9aa3ad" stroke-width="4"/>
    <g stroke="#9aa3ad" stroke-width="2">
      <path d="M130 222v100M80 272h100M95 237l70 70M95 307l70-70"/>
      <path d="M350 222v100M300 272h100M315 237l70 70M315 307l70-70"/>
    </g>
    <circle cx="130" cy="272" r="7" fill="#1d1a16"/>
    <circle cx="350" cy="272" r="7" fill="#1d1a16"/>
  </g>

  <!-- frame (Zig orange), outlined -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 272 L230 274 L205 172 Z M205 172 L320 166 L230 274 M320 166 L350 272" stroke="#1d1a16" stroke-width="16"/>
    <path d="M130 272 L230 274 L205 172 Z M205 172 L320 166 L230 274 M320 166 L350 272" stroke="#f7a41d" stroke-width="9"/>
    <!-- saddle, bars -->
    <path d="M186 160 h36" stroke="#1d1a16" stroke-width="12"/>
    <path d="M318 162 l22 -8 c14 -4 20 8 12 22 c-4 7 -12 8 -16 4" stroke="#1d1a16" stroke-width="9"/>
    <!-- crank and pedal -->
    <path d="M230 274 L256 298" stroke="#1d1a16" stroke-width="8"/>
    <circle cx="230" cy="274" r="11" fill="#cfd5db" stroke="#1d1a16" stroke-width="5"/>
  </g>

  <!-- back crest -->
  <path class="ol" d="M222 128 l6 -22 l12 14 l8 -24 l12 18 l10 -24 l12 20 l10 -22 l10 20 l10 -16 l6 16 Z" fill="#1d3f8f" stroke-width="5"/>
  <!-- body, leaning over the bars -->
  <path class="ol" d="M198 168 C192 140 224 116 268 108 C298 103 318 108 322 124 C326 142 300 160 262 168 C234 174 204 180 198 168 Z" fill="#2f6fe0" stroke-width="6"/>
  <!-- belly shade -->
  <path d="M212 170 C238 168 270 162 300 148" fill="none" stroke="#8fb4ff" stroke-width="7" stroke-linecap="round"/>
  <!-- race bib -->
  <g transform="rotate(-12 250 135)">
    <rect x="232" y="122" width="38" height="28" rx="4" fill="#fff" class="ol" stroke-width="4"/>
    <text x="251" y="143" font-family="ui-monospace, monospace" font-weight="700" font-size="17" text-anchor="middle" fill="#1d1a16">17</text>
  </g>

  <!-- near leg to the pedal -->
  <path class="ol" d="M220 166 L268 214 L256 296" fill="none" stroke-width="26"/>
  <path d="M220 166 L268 214 L256 296" fill="none" stroke="#2f6fe0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="262" cy="300" rx="16" ry="8" fill="#1d3f8f" class="ol" stroke-width="5"/>

  <!-- near arm to the bars -->
  <path class="ol" d="M298 126 L330 150 L344 170" fill="none" stroke-width="22"/>
  <path d="M298 126 L330 150 L344 170" fill="none" stroke="#2f6fe0" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="346" cy="172" r="9" fill="#1d3f8f" class="ol" stroke-width="5"/>

  <!-- head: the agama's orange-red -->
  <path class="ol" d="M300 112 C300 84 324 70 350 74 C374 78 392 92 392 108 C392 122 376 128 356 128 C336 130 304 132 300 112 Z" fill="#ff6a2b" stroke-width="6"/>
  <path d="M312 120 C330 124 356 124 380 118" fill="none" stroke="#e0521a" stroke-width="5" stroke-linecap="round"/>
  <!-- cheek -->
  <ellipse cx="364" cy="110" rx="8" ry="5" fill="#ffb199" opacity="0.9"/>
  <!-- grin -->
  <path d="M352 116 C364 120 376 118 386 112" fill="none" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="346" cy="98" r="12" fill="#fff" class="ol" stroke-width="4"/>
  <circle cx="351" cy="99" r="6" fill="#1d1a16"/>
  <circle cx="353" cy="96" r="2" fill="#fff"/>
  <!-- nostril -->
  <circle cx="384" cy="100" r="2.5" fill="#1d1a16"/>

  <!-- helmet: Zig orange with vents -->
  <path class="ol" d="M302 98 C300 70 326 56 352 60 C374 64 386 76 384 88 C366 82 330 88 302 98 Z" fill="#f7a41d" stroke-width="6"/>
  <path d="M322 74 l8 12 M340 66 l6 14 M358 66 l4 14" stroke="#1d1a16" stroke-width="4" stroke-linecap="round"/>
  <path d="M318 98 C322 110 330 118 340 122" fill="none" stroke="#1d1a16" stroke-width="3"/>
</svg>
