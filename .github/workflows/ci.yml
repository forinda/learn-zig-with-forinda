name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every lesson step builds and passes its tests with Zig 0.17, on each system readers use.
  steps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # this job needs no packages (only Node and Zig); v5 would otherwise look for pnpm to cache
          package-manager-cache: false
      - name: Build and test every step
        run: node scripts/check-steps.ts
      - name: Step diffs are up to date
        run: node scripts/diff-steps.ts --check

  # The site: page rules, template checks, and a build that fails on broken links or bad frontmatter.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
