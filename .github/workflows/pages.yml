name: Pages

# The course site on GitHub Pages, at https://forinda.github.io/learn-zig-with-forinda/ (Vite's base from BASE).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE: /learn-zig-with-forinda/
      # The Pages artifact, made by hand: upload-pages-artifact leaves out hidden folders, and the theme's CSS and
      # scripts are emitted under assets/node_modules/.pnpm/... (a clarusjs naming quirk), so they'd 404.
      - run: tar --dereference --hard-dereference --directory dist/client -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
